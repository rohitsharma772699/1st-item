<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body {
            background: linear-gradient(135deg, #168ef7, #f4ca12);
            color: #1a2a44;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        form {
            background: #10fd3c;
            border: 2px solid #ef7f06;
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #1356ba;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            background: #35f8c4;
            color: rgb(13, 28, 228);
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            cursor: pointer;
        }
        button:hover {
            background: #3366cc;
        }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <br><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
